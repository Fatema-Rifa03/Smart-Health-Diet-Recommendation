<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Smart Health & Diet Recommendation System</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top left, rgba(30, 143, 170, 0.08), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(42, 179, 192, 0.08), transparent 40%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xl);
      padding: 36px 32px;
    }
    .role-tab-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: var(--bg-page);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .role-tab {
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .role-tab.active {
      background-color: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .demo-pill {
      font-size: 0.75rem;
      padding: 6px 12px;
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border-radius: var(--radius-full);
      cursor: pointer;
      font-weight: 600;
      border: 1px solid rgba(30, 143, 170, 0.2);
      transition: var(--transition);
    }
    .demo-pill:hover {
      background-color: var(--primary);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="text-center" style="margin-bottom: 28px;">
        <a href="index.html">
          <img src="../assets/images/logo.jpg" alt="Logo" style="width: 64px; height: 64px; border-radius: var(--radius-lg); margin: 0 auto 12px auto; object-fit: cover; box-shadow: var(--shadow-md);">
        </a>
        <h1 class="text-2xl font-bold">Welcome Back</h1>
        <p class="text-muted text-sm" style="margin-top: 4px;">Sign in to access your portal</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tab-group" id="roleTabs">
        <div class="role-tab active" data-role="user">User</div>
        <div class="role-tab" data-role="dietitian">Dietitian</div>
        <div class="role-tab" data-role="admin">Admin</div>
      </div>

      <!-- Quick Demo Fillers -->
      <div style="margin-bottom: 20px;">
        <span class="text-xs text-muted font-semibold block" style="margin-bottom: 8px;">Quick Demo Fill:</span>
        <div class="flex gap-2 flex-wrap">
          <span class="demo-pill" onclick="fillDemo('user@example.com', 'user')">👤 User Demo</span>
          <span class="demo-pill" onclick="fillDemo('sarah.j@smarthealth.com', 'dietitian')">🩺 Dietitian Demo</span>
          <span class="demo-pill" onclick="fillDemo('admin@smarthealth.com', 'admin')">⚡ Admin Demo</span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required value="user@example.com">
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center" style="margin-bottom: 4px;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" class="text-xs text-primary font-semibold hover:underline" onclick="alert('Password reset link sent to your email!')">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="password123">
        </div>

        <div class="flex items-center gap-2" style="margin-bottom: 24px;">
          <input type="checkbox" id="remember" checked style="accent-color: var(--primary);">
          <label for="remember" class="text-xs text-muted font-medium">Keep me signed in</label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Sign In
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="text-center" style="margin-top: 24px; font-size: 0.875rem;">
        <span class="text-muted">Don't have an account?</span>
        <a href="register.html" class="font-bold text-primary hover:underline">Create an account</a>
      </div>

    </div>
  </div>

  <script src="../assets/js/dummy-data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    let selectedRole = 'user';

    document.querySelectorAll('.role-tab').forEach(tab => {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        selectedRole = this.getAttribute('data-role');
      });
    });

    function fillDemo(email, role) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'password123';
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t => {
        t.classList.toggle('active', t.getAttribute('data-role') === role);
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store token in cookies and local storage (fallback)
          document.cookie = "shd_token=" + data.session.access_token + "; path=/; max-age=604800"; // 7 days
          localStorage.setItem('shd_token', data.session.access_token);
          
          // Map backend 'full_name' to 'name' for frontend compatibility
          const userData = { ...data.user, name: data.user.full_name };
          localStorage.setItem('shd_current_user', JSON.stringify(userData));
          
          // Use the role from the backend
          const role = data.user.role;
          
          if (role === 'user') {
            window.location.href = '../user/dashboard.html';
          } else if (role === 'dietitian') {
            window.location.href = '../dietitian/dashboard.html';
          } else if (role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            alert('Unknown role');
          }
        } else {
          alert('Login failed: ' + (data.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error during login:', error);
        alert('An error occurred during login. Please ensure the backend server is running.');
      }
    });
  </script>
</body>
</html>
