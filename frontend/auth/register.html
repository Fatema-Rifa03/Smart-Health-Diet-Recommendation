<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Smart Health & Diet Recommendation System</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at top left, rgba(30, 143, 170, 0.08), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(42, 179, 192, 0.08), transparent 40%);
    }
    .auth-card {
      width: 100%;
      max-width: 520px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xl);
      padding: 36px 32px;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="text-center" style="margin-bottom: 24px;">
        <a href="index.html">
          <img src="../assets/images/logo.jpg" alt="Logo" style="width: 56px; height: 56px; border-radius: var(--radius-md); margin: 0 auto 10px auto; object-fit: cover;">
        </a>
        <h1 class="text-2xl font-bold">Create Account</h1>
        <p class="text-muted text-sm" style="margin-top: 4px;">Join Smart Health & Diet Recommendation System</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm">
        
        <div class="form-group">
          <label class="form-label" for="roleSelect">I want to register as a:</label>
          <select id="roleSelect" class="form-control" onchange="toggleHealthFields()">
            <option value="user">Patient / User (Health & Diet Tracker)</option>
            <option value="dietitian">Dietitian (Require Admin Approval)</option>
          </select>
        </div>

        <div class="grid grid-2 gap-4">
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="e.g. Fatema Rifa" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <!-- User Specific Health Information Onboarding -->
        <div id="userHealthFields" style="background-color: var(--bg-page); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; border: 1px solid var(--border);">
          <span class="text-xs font-bold text-primary uppercase block" style="margin-bottom: 12px; letter-spacing: 0.05em;">Health Onboarding Data</span>

          <div class="grid grid-3 gap-3" style="margin-bottom: 12px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label text-xs" for="age">Age</label>
              <input type="number" id="age" class="form-control" placeholder="24" value="24">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label text-xs" for="height">Height (cm)</label>
              <input type="number" id="height" class="form-control" placeholder="165" value="165">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label text-xs" for="weight">Weight (kg)</label>
              <input type="number" id="weight" class="form-control" placeholder="65" value="65">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label text-xs" for="goal">Primary Fitness Goal</label>
            <select id="goal" class="form-control">
              <option value="Weight Loss & Fat Burn">Weight Loss & Fat Burn</option>
              <option value="Healthy Living & Maintenance">Healthy Living & Maintenance</option>
              <option value="Muscle Building & Gain">Muscle Building & Gain</option>
            </select>
          </div>
        </div>

        <!-- Dietitian Specific Credentials -->
        <div id="dietitianFields" style="display: none; background-color: var(--bg-page); padding: 16px; border-radius: var(--radius-md); margin-bottom: 20px; border: 1px solid var(--border);">
          <span class="text-xs font-bold text-accent uppercase block" style="margin-bottom: 12px; letter-spacing: 0.05em;">Professional Credentials</span>

          <div class="form-group">
            <label class="form-label text-xs" for="specialty">Specialty / Qualification</label>
            <input type="text" id="specialty" class="form-control" placeholder="e.g. Clinical Nutritionist">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Complete Registration
        </button>
      </form>

      <div class="text-center" style="margin-top: 24px; font-size: 0.875rem;">
        <span class="text-muted">Already have an account?</span>
        <a href="login.html" class="font-bold text-primary hover:underline">Sign In</a>
      </div>

    </div>
  </div>

  <script src="../assets/js/dummy-data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    function toggleHealthFields() {
      const role = document.getElementById('roleSelect').value;
      if (role === 'user') {
        document.getElementById('userHealthFields').style.display = 'block';
        document.getElementById('dietitianFields').style.display = 'none';
      } else {
        document.getElementById('userHealthFields').style.display = 'none';
        document.getElementById('dietitianFields').style.display = 'block';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('roleSelect').value;

      try {
        const response = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            full_name: name, 
            email: email, 
            password: password, 
            role: role,
            age: role === 'user' ? parseInt(document.getElementById('age').value) : null,
            height_cm: role === 'user' ? parseFloat(document.getElementById('height').value) : null,
            current_weight_kg: role === 'user' ? parseFloat(document.getElementById('weight').value) : null,
            primary_goal: role === 'user' ? document.getElementById('goal').value : null,
            daily_calorie_target: role === 'user' ? 2000 : null,
            specialty: role === 'dietitian' ? document.getElementById('specialty').value : null
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store token in cookies
          if (data.session && data.session.access_token) {
            document.cookie = "shd_token=" + data.session.access_token + "; path=/; max-age=604800"; // 7 days
            localStorage.setItem('shd_token', data.session.access_token);
          }

          alert(role === 'user' ? 'Account created successfully! Redirecting to login page...' : 'Dietitian application submitted! Pending Admin approval. Redirecting to login page...');

          window.location.href = 'login.html';
        } else {
          alert('Registration failed: ' + (data.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error during registration:', error);
        alert('An error occurred during registration. Please ensure the backend server is running.');
      }
    });
  </script>
</body>
</html>
