<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Meal Plan - Dietitian Portal</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

  <div class="dashboard-layout">
    
    <aside class="sidebar">
      <div>
        <div class="sidebar-brand">
          <img src="../assets/images/logo.jpg" alt="Logo">
          <div>
            <span class="sidebar-brand-text">Dietitian Portal</span>
            <span class="text-xs text-muted block font-medium">& Clinical Care</span>
          </div>
        </div>

        <nav class="sidebar-menu">
          <a href="dashboard.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dietitian Overview
          </a>
          <a href="patients.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Patient Health Records
          </a>
          <a href="meal-builder.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Create Meal Plans
          </a>
          <a href="guidance-requests.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/></svg>
            Guidance Requests
          </a>
          <a href="recipe-upload.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Upload Recipes & Guides
          </a>
          <a href="chat.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Patient Inbox
          </a>
        </nav>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 16px;">
        <a href="../auth/login.html" class="sidebar-link text-danger" onclick="localStorage.removeItem('shd_current_user')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="9"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <div class="main-wrapper">
      
      <header class="top-header">
        <h1 class="text-xl font-bold">Build & Assign Custom Patient Meal Plan</h1>
        <div class="user-profile-menu">
          <span class="font-bold text-sm">Dr. Sarah Jenkins</span>
          <img src="../assets/images/images.jpeg" alt="Avatar" class="user-avatar">
        </div>
      </header>

      <main class="dashboard-content">
        
        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <div class="card-header">
            <h2 class="card-title">Custom Meal Plan Form</h2>
          </div>

          <form id="builderForm">
            <div class="form-group">
              <label class="form-label" for="selectPatient">Target Patient</label>
              <select id="selectPatient" class="form-control" required>
                <option value="Fatema Rifa">Fatema Rifa (Goal: Weight Loss)</option>
                <option value="Tanvir Ahmed">Tanvir Ahmed (Goal: Muscle Gain)</option>
              </select>
            </div>

            <div class="grid grid-2 gap-4">
              <div class="form-group">
                <label class="form-label" for="planTitle">Plan Title</label>
                <input type="text" id="planTitle" class="form-control" placeholder="e.g. Low-Carb High-Protein Plan" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="targetCalories">Target Daily Calories (kcal)</label>
                <input type="number" id="targetCalories" class="form-control" value="1800" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="breakfast">Breakfast Recommendation</label>
              <input type="text" id="breakfast" class="form-control" placeholder="Berry Oatmeal with chia seeds (350 kcal)" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="lunch">Lunch Recommendation</label>
              <input type="text" id="lunch" class="form-control" placeholder="Grilled Chicken Salad (480 kcal)" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="dinner">Dinner Recommendation</label>
              <input type="text" id="dinner" class="form-control" placeholder="Steamed Salmon with Asparagus (550 kcal)" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 12px;">
              Publish & Send Meal Plan
            </button>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="../assets/js/dummy-data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.getElementById('builderForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const patient = document.getElementById('selectPatient').value;
      const title = document.getElementById('planTitle').value;
      alert(`Meal plan "${title}" successfully published and sent to ${patient}!`);
      this.reset();
    });
  </script>
</body>
</html>
