  <script src="../assets/js/main.js"></script>
  <script>
    async function renderRecipes() {
      const grid = document.getElementById('recipesGrid');
      try {
        const { recipes = [] } = await SHD_UI.request('/user/recipes');
        grid.innerHTML = recipes.length ? recipes.map(r => `
        <div class="card" style="padding: 0; overflow: hidden;">
          <img src="${r.image_url || '../assets/images/logo.jpg'}" style="width: 100%; height: 160px; object-fit: cover;">
          <div style="padding: 20px;">
            <span class="badge badge-primary" style="margin-bottom: 8px;">${r.category}</span>
            <h3 class="font-bold text-lg" style="margin-bottom: 6px;">${r.title}</h3>
            <p class="text-xs text-muted" style="margin-bottom: 16px;">Author: <strong>${r.author}</strong> | Prep: ${r.prep_time_minutes || 0} mins</p>
            <div class="flex justify-between items-center border-t border-slate-100 pt-3">
              <span class="font-bold text-primary">${r.calories} kcal</span>
              <button class="btn btn-secondary btn-sm" onclick="viewRecipe('${r.id}')">View Guide</button>
            </div>
          </div>
        </div>
      `).join('') : '<div class="card"><p class="text-muted">No published recipes are available yet.</p></div>';
      } catch (error) { grid.innerHTML = `<div class="card"><p class="text-danger">${error.message}</p></div>`; }
    }

    async function viewRecipe(id) {
      try {
        const { recipes = [] } = await SHD_UI.request('/user/recipes');
        const recipe = recipes.find(item => item.id === id);
        if (recipe) alert(`${recipe.title}\n\n${recipe.instructions || 'Full preparation guide coming soon.'}`);
      } catch (error) { alert(error.message); }
    }

    document.addEventListener('DOMContentLoaded', renderRecipes);
  </script>
